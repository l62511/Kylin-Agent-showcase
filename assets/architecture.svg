<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Kylin Agent 六服务架构总览</title>
  <desc id="desc">Browser and Nginx front end, Spring Boot authentication gateway, FastAPI control plane, two managed agent nodes, RabbitMQ reliable event bus, and SQLite or etcd state.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#3857d6"/></marker>
    <marker id="arrow-muted" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L11,4 z" fill="#66758b"/></marker>
    <style>
      .box{stroke:#26364d;stroke-width:2;rx:18;ry:18}
      .title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#10233f}
      .label{font:700 21px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#10233f}
      .small{font:400 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#34465d}
      .arrow{stroke:#3857d6;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dashed{stroke:#66758b;stroke-width:2.5;stroke-dasharray:9 8;fill:none;marker-end:url(#arrow-muted)}
      .chip{font:600 14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#26364d}
    </style>
  </defs>
  <rect width="1600" height="920" fill="#f7f9fc"/>
  <text x="70" y="62" class="title">Kylin Agent · 六服务架构与可靠事件边界</text>
  <text x="70" y="94" class="small">第十五届“中国软件杯”全国三等奖项目 · 龙芯 3A5000 / LoongArch64 / 银河麒麟 V11</text>

  <rect x="70" y="145" width="230" height="112" class="box" fill="#e3edff"/>
  <text x="185" y="188" text-anchor="middle" class="label">Browser</text>
  <text x="185" y="218" text-anchor="middle" class="small">Vue 控制台 · SSE</text>
  <rect x="350" y="145" width="230" height="112" class="box" fill="#e9f7f0"/>
  <text x="465" y="188" text-anchor="middle" class="label">Nginx</text>
  <text x="465" y="218" text-anchor="middle" class="small">TLS · 静态资源</text>
  <rect x="630" y="145" width="300" height="112" class="box" fill="#dff3ea"/>
  <text x="780" y="188" text-anchor="middle" class="label">Spring Boot Gateway</text>
  <text x="780" y="218" text-anchor="middle" class="small">Sa-Token · RBAC · HMAC v2</text>
  <path d="M300 201 H350 M580 201 H630" class="arrow"/>

  <rect x="500" y="340" width="600" height="168" class="box" fill="#ffe9e4"/>
  <text x="800" y="385" text-anchor="middle" class="label">FastAPI Control Plane</text>
  <text x="800" y="416" text-anchor="middle" class="small">Planning · Approval · Audit · Evaluation</text>
  <text x="800" y="448" text-anchor="middle" class="small">ChatExecutionService · A2A · MCP · bounded workers</text>
  <text x="800" y="480" text-anchor="middle" class="small">canonical fingerprint · cancellation · evidence gate</text>
  <path d="M780 257 V340" class="arrow"/>

  <rect x="90" y="625" width="320" height="150" class="box" fill="#fff0d2"/>
  <text x="250" y="671" text-anchor="middle" class="label">Managed Agent Node A</text>
  <text x="250" y="702" text-anchor="middle" class="small">Collection · Preflight · Execution</text>
  <text x="250" y="730" text-anchor="middle" class="small">命令 / 文件 / Docker / 数据库</text>
  <rect x="1190" y="625" width="320" height="150" class="box" fill="#fff0d2"/>
  <text x="1350" y="671" text-anchor="middle" class="label">Managed Agent Node B</text>
  <text x="1350" y="702" text-anchor="middle" class="small">Collection · Preflight · Execution</text>
  <text x="1350" y="730" text-anchor="middle" class="small">节点令牌 · HMAC · 可取消操作</text>
  <path d="M630 508 V570 H250 V625 M970 508 V570 H1350 V625" class="arrow"/>
  <text x="380" y="556" text-anchor="middle" class="chip">HTTP + HMAC v2</text>
  <text x="1220" y="556" text-anchor="middle" class="chip">HTTP + Node Token</text>

  <rect x="535" y="625" width="530" height="150" class="box" fill="#eadfff"/>
  <text x="800" y="671" text-anchor="middle" class="label">RabbitMQ Reliable Event Bus</text>
  <text x="800" y="702" text-anchor="middle" class="small">durable topic · publisher confirm · manual ACK</text>
  <text x="800" y="730" text-anchor="middle" class="small">DLX / DLQ · 重复投递与毒消息隔离</text>
  <path d="M800 508 V625" class="dashed"/>
  <text x="840" y="590" class="chip">AMQP</text>

  <rect x="260" y="830" width="1080" height="55" class="box" fill="#243550" stroke="#243550"/>
  <text x="800" y="865" text-anchor="middle" font="600 18px 'Segoe UI','Microsoft YaHei',sans-serif" fill="#ffffff">SQLite WAL / etcd · Outbox · 执行状态 · 租约 · 幂等账本 · 审计链 · Trace/Replay</text>
  <path d="M800 775 V830" class="dashed"/>
  <path d="M250 775 V805 H800 V830 M1350 775 V805 H800" class="dashed"/>
</svg>
