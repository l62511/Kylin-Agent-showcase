<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="650" viewBox="0 0 1500 650" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-Governed AIOps Chinese Benchmark v1.3.0</title>
  <desc id="desc">The benchmark inventory contains six datasets and explicitly separates unique source cases, compatibility projections, and contract-only sections.</desc>
  <defs><style>.b{stroke:#26364d;stroke-width:2;rx:15;ry:15}.t{font:700 22px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#10233f}.s{font:400 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#34465d}.n{font:700 26px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#10233f}</style></defs>
  <rect width="1500" height="650" fill="#f7f9fc"/><text x="55" y="55" class="t">Evidence-Governed AIOps Chinese Benchmark v1.3.0</text>
  <rect x="510" y="105" width="480" height="92" class="b" fill="#243550" stroke="#243550"/><text x="750" y="145" text-anchor="middle" font="700 22px 'Segoe UI','Microsoft YaHei',sans-serif" fill="#fff">全量清单：4,380 行</text><text x="750" y="174" text-anchor="middle" font="400 16px 'Segoe UI','Microsoft YaHei',sans-serif" fill="#dbe6f5">4,200 unique source + 180 projection duplicate</text>
  <rect x="70" y="275" width="260" height="120" class="b" fill="#e3edff"/><text x="200" y="322" text-anchor="middle" class="t">OpsIntent / Planner</text><text x="200" y="357" text-anchor="middle" class="n">800</text><text x="200" y="383" text-anchor="middle" class="s">工具/参数/计划结构</text>
  <rect x="370" y="275" width="260" height="120" class="b" fill="#e5f4e8"/><text x="500" y="322" text-anchor="middle" class="t">OpsRAG</text><text x="500" y="357" text-anchor="middle" class="n">300</text><text x="500" y="383" text-anchor="middle" class="s">检索与引用</text>
  <rect x="670" y="275" width="260" height="120" class="b" fill="#fff0cf"/><text x="800" y="322" text-anchor="middle" class="t">OpsSafety</text><text x="800" y="357" text-anchor="middle" class="n">1,200</text><text x="800" y="383" text-anchor="middle" class="s">安全边界与 hard gate</text>
  <rect x="970" y="275" width="260" height="120" class="b" fill="#f0e6ff"/><text x="1100" y="322" text-anchor="middle" class="t">Evidence Gate</text><text x="1100" y="357" text-anchor="middle" class="n">1,600</text><text x="1100" y="383" text-anchor="middle" class="s">contract-only 回放</text>
  <rect x="1270" y="275" width="170" height="120" class="b" fill="#ffe3e0"/><text x="1355" y="322" text-anchor="middle" class="t">Fault</text><text x="1355" y="357" text-anchor="middle" class="n">300</text><text x="1355" y="383" text-anchor="middle" class="s">静态规范</text>
  <rect x="70" y="450" width="260" height="100" class="b" fill="#e9edf3"/><text x="200" y="490" text-anchor="middle" class="t">Agent 单工具投影</text><text x="200" y="526" text-anchor="middle" class="n">180</text>
  <rect x="370" y="450" width="1070" height="100" class="b" fill="#eef3fa"/><text x="905" y="490" text-anchor="middle" class="t">每条结果绑定 SHA-256 manifest、case identity fingerprint、split 与 provenance</text><text x="905" y="526" text-anchor="middle" class="s">contract-only / unavailable / not_executed 不转换为通过；全量 split=all 不是 holdout 泛化结果</text>
</svg>
